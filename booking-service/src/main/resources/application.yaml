spring:
  application:
    name: booking-service

  logging:
    level:
      com.rubenmarin.bookingservice.infrastructure.adapter.out.kafka.OutboxScheduler: DEBUG

  datasource:
    url: jdbc:postgresql://localhost:5433/bookingdb
    username: booking_user
    password: booking_dev

  jpa:
    hibernate:
      #Hibernate no crea ni modifica tablas automáticamente
      ddl-auto: none
    #Evita mantener abierto el contexto de persistencia durante la respuesta HTTP
    open-in-view: false

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all #Kafka confirma el envío cuando lo han reconocido las réplicas requeridas

ibm:
  mq:
    queueManager: QM1
    channel: DEV.APP.SVRCONN
    connName: localhost(1414)
    user: app
    password: passw0rd

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info


clients:
  event-service:
    base-url: http://localhost:8080




