logging:
  pattern:
    correlation: "[traceId=%X{traceId:-},spanId=%X{spanId:-}] "

spring:
  application:
    name: ai-assistant-service

  profiles:
    active: dev
    #active: prod

  config:
    import: optional:file:.env[.properties]

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        model: ${OPENAI_MODEL:gpt-5-nano}

    tools:
      throw-exception-on-error: false #explicitly enable returning tool errors to the model

  reactor:
    context-propagation: auto

server:
  port: 8083

eventhub:
  event-service:
    base-url: http://localhost:8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

  tracing:
    sampling:
      probability: 1.0

  otlp:
    metrics:
      export:
        enabled: false

  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces