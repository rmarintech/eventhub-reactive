spring:
  application:
    name: ai-assistant-service

  profiles:
    active: dev

  config:
    import: optional:file:.env[.properties]

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}

    tools:
      throw-exception-on-error: false #explicitly enable returning tool errors to the model

server:
  port: 8083

eventhub:
  event-service:
    base-url: http://localhost:8080