spring:
  application:
    name: ai-assistant-service

  profiles:
    #active: dev
    active: prod

  config:
    import: optional:file:.env[.properties]

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        model: ${OPENAI_MODEL:gpt-5-nano}

    tools:
      throw-exception-on-error: false #explicitly enable returning tool errors to the model

server:
  port: 8083

eventhub:
  event-service:
    base-url: http://localhost:8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics