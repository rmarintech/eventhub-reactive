spring:
  application:
    name: payment-service

  datasource:
    url: jdbc:postgresql://localhost:5434/paymentdb
    username: payment_user
    password: payment_dev

  jpa:
    hibernate:
      #none: Hibernate no comprueba ni modifica el esquema.
      #validate: Hibernate comprueba que las entidades son compatibles con el esquema existente, sin modificarlo.
      ddl-auto: validate
    #Evita mantener abierto el contexto de persistencia durante la respuesta HTTP
    open-in-view: false

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info

flyway:
  enabled: true
  locations: classpath:db/migration